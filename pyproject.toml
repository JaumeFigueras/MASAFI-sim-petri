[build-system]
requires = ["setuptools>=77.0"]
build-backend = "setuptools.build_meta"

[project]
name = "masafi-sim-petri"
version = "0.1.0"
description = "Petri Nets for discrete event simulation"
readme = "README.md"
requires-python = ">=3.11"
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
authors = [
    { name = "Jaume Figueras", email = "jaume.figueras.jove@gmail.com" },
]
keywords = ["petri-net", "discrete-event-simulation", "simulation"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering",
]
dependencies = [
    "simpy>=4.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-cov>=6.0",
    "build>=1.2",
]
docs = [
    "sphinx>=9.1.0",
    "sphinx-rtd-theme>=3.1.0",
    "Pygments>=2.20.0",
]

[tool.setuptools.packages.find]
where = ["src"]
# src/examples holds runnable scripts, not library code. They are deliberately
# not part of the distribution; this keeps them out even if the directory ever
# gains an __init__.py.
exclude = ["examples*"]

[tool.coverage.report]
# The script guard runs only when a module is invoked directly, which the
# example tests do in a subprocess where coverage cannot see it.
exclude_also = [
    "if __name__ == '__main__':",
]

[tool.pytest.ini_options]
testpaths = ["test"]
# `importlib` import mode lets the test tree mirror the package tree without
# `__init__.py` files: test/petri_net/test_place.py and a future
# test/analysis/test_place.py can coexist without a module name clash.
addopts = "--strict-markers --import-mode=importlib"
