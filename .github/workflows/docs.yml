# Build the Sphinx documentation and publish it to GitHub Pages.
#
# Runs on every push to main. Pull requests build and doctest the docs too, so
# a broken page is caught before it is merged, but only main is published.
#
# One-time setup on GitHub: Settings -> Pages -> Build and deployment ->
# Source: "GitHub Actions".

name: Docs

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# A newer push supersedes a deployment still in progress, so the published
# site always follows the latest commit.
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: pyproject.toml

      # conf.py reads the release from the installed distribution metadata,
      # so the docs only build with the package installed.
      - name: Install the package with the docs extra
        run: python -m pip install ".[docs]"

      # The build is kept warning-free; -W turns a new warning into a failure,
      # --keep-going reports all of them instead of stopping at the first.
      # There is no .venv here, so the Makefile falls back to python3, which
      # setup-python has put on PATH.
      - name: Build the HTML documentation
        run: make docs SPHINXOPTS="-W --keep-going"

      - name: Run the documentation doctests
        run: make doctest

      - uses: actions/upload-pages-artifact@v4
        with:
          path: docs/build/html

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
